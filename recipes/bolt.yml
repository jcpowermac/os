---
# name determines the ghcr package: ghcr.io/jcpowermac/os-bolt
# Headless bolt VM image: per-app waypipe projection, no greeter, no signing
# (bootc-image-builder consumes it unsigned — it never ostree-verifies).
# Base: official minimal bootc image — kernel + openssh-server + ostree already in.
# waypipe 0.11's `server` mode is itself a fake Wayland compositor, so no sway
# or other desktop compositor is needed in the guest (Ruling B0-1).
name: os-bolt
description: Headless minimal variant for disposable waypipe-projected UI VMs.
base-image: quay.io/fedora/fedora-bootc
image-version: 44
modules:
  - type: rpm-ostree
    install:
      - waypipe   # `waypipe server` = per-app fake Wayland compositor (guest side)
      - firefox   # first projected app; add more here as needed
      - systemd-networkd  # declarative link config (baked .network file); NM masked in the guest — the runtime ip-script + NM left DNS to systemd-resolved's stub with no upstream
      - nmap-ncat         # qvm-ctl relay bridges the guest waypipe unix socket to the dom0 TCP data port (no SSH in the projection path)
      - xwayland-satellite # firefox is an X client: waypipe --xwls needs this in PATH to bind an X display socket
      - dkms
      - kernel-devel
      - gcc
      - git
  # i915-sriov: the guest MUST run the same SR-IOV driver, not the in-tree one
  # (strongtz install-linux-guest.md: in-tree 7.2 i915/xe have no ARL SR-IOV VF
  # device IDs, so a stock guest can't bind a passed-through VF). Baked at image
  # build like on the host: cloned at tag 2026.09.16, dkms-built against the
  # image's kernel-devel, installed to /lib/modules/<kver>/updates. Only does
  # anything when a VF is actually passed through (alias match), inert otherwise.
  # Guest cmdline params (i915.enable_guc=3 module_blacklist=xe) belong in the
  # qlvm libxl guest config at VF bring-up, not here.
  # https://github.com/strongtz/i915-sriov-dkms — handoff-2026-10-03.md thread 2.
  - type: script
    snippets:
      - 'set -e; rm -rf /src/i915-sriov-dkms; git clone --depth 1 --branch 2026.09.16 https://github.com/strongtz/i915-sriov-dkms /src/i915-sriov-dkms'
      - 'set -e; kver=$(ls /usr/src/kernels/); echo "building i915-sriov-dkms against ${kver}"; cd /src/i915-sriov-dkms && dkms add . && dkms build i915-sriov-dkms/2026.09.16 -k "${kver}" && dkms install i915-sriov-dkms/2026.09.16 -k "${kver}"'
