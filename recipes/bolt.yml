---
# name determines the ghcr package: ghcr.io/jcpowermac/os-bolt
# Headless bolt VM image: per-app waypipe projection, no greeter, no signing
# (bootc-image-builder consumes it unsigned — it never ostree-verifies).
# Base: official minimal bootc image — kernel + openssh-server + ostree already in.
# waypipe 0.11's `server` mode is itself a fake Wayland compositor, so no sway
# or other desktop compositor is needed in the guest (Ruling B0-1).
name: os-bolt
description: Headless minimal variant for disposable waypipe-projected UI VMs.
base-image: quay.io/fedora/fedora-bootc
image-version: 44
modules:
  - type: rpm-ostree
    install:
      - waypipe   # `waypipe server` = per-app fake Wayland compositor (guest side)
      - firefox   # first projected app; add more here as needed
      - systemd-networkd  # declarative link config (baked .network file); NM masked in the guest — the runtime ip-script + NM left DNS to systemd-resolved's stub with no upstream
      - nmap-ncat         # qvm-ctl relay bridges the guest waypipe unix socket to the dom0 TCP data port (no SSH in the projection path)
      - xwayland-satellite # firefox is an X client: waypipe --xwls needs this in PATH to bind an X display socket
