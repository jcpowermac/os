---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: os
# description will be included in the image's metadata
description: This is my personal OS image.

# base: Fedora Sway Atomic 44 (official Fedora atomic desktop image)
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

modules:
  # The OVN rpm %pre scriptlets `touch /var/lib/rpm-state/ovn-*`. That dir is
  # owned by the `filesystem` rpm but ostree container roots have an empty
  # /var, so the touch (and the whole transaction) fails without it. Ostree
  # commits preserve empty dirs, so this survives into the image.
  - type: script
    snippets:
      - "mkdir -p /var/lib/rpm-state"
  - type: rpm-ostree
    install:
      - NetworkManager-openconnect-gnome
      - NetworkManager-openvpn-gnome
      - Thunar
      - blueman
      - bolt
      - dunst
      - foot
      - fprintd-pam
      - gnome-keyring-pam
      - gvfs
      - gvfs-smb
      - grim
      - imv
      - kanshi
      - lxqt-policykit
      - mesa-dri-drivers
      - mesa-vulkan-drivers
      - micro
      - genisoimage
      - network-manager-applet
      - NetworkManager-ovs
      - openvswitch
      - openvswitch-ovn-central
      - openvswitch-ovn-host
      - pavucontrol
      - perl
      - qemu-img
      - pinentry-gnome3
      - playerctl
      - plymouth-system-theme
      - polkit
      - pulseaudio-utils
      - sddm
      - sddm-wayland-sway
      - slurp
      - sshuttle
      - sway
      - sway-config-fedora
      - swaybg
      - swayidle
      - swaylock
      - system-config-printer
      - thunar-archive-plugin
      - tmux
      - tmux-powerline
      - tuned
      - tuned-ppd
      - tuned-switcher
      - vim-enhanced
      - vim-powerline
      - waybar
      - waypipe
      - wev
      - wl-clipboard
      - wlr-randr
      - wlsunset
      - xarchiver
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-wlr
      - xen
      - xen-libs
      - xen-runtime
      - xorg-x11-server-Xwayland
      - zsh
      - btop
      - golang
      - piper
      - logiops
      - wf-recorder
      - dkms
      - kernel-devel
      - gcc
      - git
  # i915-sriov: SR-IOV-patched i915 (+xe) kernel modules (strongtz/i915-sriov-dkms,
  # release 2026.09.16, BUILD_EXCLUSIVE_KERNEL 6.17-7.2). Baked at image build:
  # cloned + dkms-built against the image's kernel-devel, installed to
  # /lib/modules/<kver>/updates (depmod'd). Re-baked on every image rebuild,
  # which is how this dom0 gets kernel updates. Needs the dom0 booted with
  # intel_iommu=on iommu=pt (xen-dom0-refresh) and BIOS VT-d on; the VF module
  # params (i915.max_vfs=7, ...) go in the cmdline at VF bring-up.
  # https://github.com/strongtz/i915-sriov-dkms — handoff-2026-10-03.md thread 2.
  # kernel-devel (which pulls kernel-core of the same version) pins the image to
  # one kernel, so the built modules always match the booted kernel.
  - type: script
    snippets:
      - 'set -e; rm -rf /src/i915-sriov-dkms; git clone --depth 1 --branch 2026.09.16 https://github.com/strongtz/i915-sriov-dkms /src/i915-sriov-dkms'
      - 'set -e; kver=$(ls /usr/src/kernels/); echo "building i915-sriov-dkms against ${kver}"; cd /src/i915-sriov-dkms && dkms add . && dkms build i915-sriov-dkms/2026.09.16 -k "${kver}" && dkms install i915-sriov-dkms/2026.09.16 -k "${kver}"'
  - type: signing # this sets up the proper policy & signing files for signed images to work fully

