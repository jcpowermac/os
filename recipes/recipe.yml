---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: os
# description will be included in the image's metadata
description: This is my personal OS image.

# base: Fedora Sway Atomic 44 (official Fedora atomic desktop image)
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

modules:
  # The OVN rpm %pre scriptlets `touch /var/lib/rpm-state/ovn-*`. That dir is
  # owned by the `filesystem` rpm but ostree container roots have an empty
  # /var, so the touch (and the whole transaction) fails without it. Ostree
  # commits preserve empty dirs, so this survives into the image.
  - type: script
    snippets:
      - "mkdir -p /var/lib/rpm-state"
  - type: rpm-ostree
    install:
      - NetworkManager-openconnect-gnome
      - NetworkManager-openvpn-gnome
      - Thunar
      - blueman
      - bolt
      - dunst
      - foot
      - fprintd-pam
      - gnome-keyring-pam
      - gvfs
      - gvfs-smb
      - grim
      - imv
      # Sole supplier of /usr/lib/firmware/i915/mtl_guc_70.bin.xz + mtl_huc_gsc.bin.xz
      # (upstream ships these compressed-only; rpm -q --whatrequires intel-gpu-firmware
      # is empty and kernel-core's firmware dep is a Recommends). Listed explicitly
      # so a base-image or weak-deps change cannot silently delete the GuC blob.
      - intel-gpu-firmware
      - kanshi
      - lxqt-policykit
      - mesa-dri-drivers
      - mesa-vulkan-drivers
      - micro
      - genisoimage
      - network-manager-applet
      - NetworkManager-ovs
      - openvswitch
      - openvswitch-ovn-central
      - openvswitch-ovn-host
      - pavucontrol
      - perl
      - qemu-img
      - pinentry-gnome3
      - playerctl
      - plymouth-system-theme
      - polkit
      - pulseaudio-utils
      - sddm
      - sddm-wayland-sway
      - slurp
      - sshuttle
      - sway
      - sway-config-fedora
      - swaybg
      - swayidle
      - swaylock
      - system-config-printer
      - thunar-archive-plugin
      - tmux
      - tmux-powerline
      - tuned
      - tuned-ppd
      - tuned-switcher
      - vim-enhanced
      - vim-powerline
      - waybar
      - waypipe
      - wev
      - wl-clipboard
      - wlr-randr
      - wlsunset
      - xarchiver
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-wlr
      - xen
      - xen-libs
      - xen-runtime
      - xorg-x11-server-Xwayland
      - zsh
      - btop
      - golang
      - piper
      - logiops
      - wf-recorder
      - gcc
      - git
  # The `files` module is what actually copies files/system/** into the image.
  # It was missing from this recipe, so the whole files/ tree was dead weight:
  # the deployed commit has no /usr/etc/yum.repos.d/{tailscale,twingate}.repo, no
  # usr/lib/tmpfiles.d/xen.conf, no xen-dom0-refresh units and no script — all of
  # those were hand-installed on the dom0 instead, which is why "it's committed
  # in os" kept failing to explain boot behaviour. It must run BEFORE `initramfs`
  # so dracut sees /etc/dracut.conf.d when it builds the image's initrd.
  - type: files
    files:
      - source: system
        destination: /
  # The stock in-tree i915 is in the initrd by dracut default and binds 00:02.0
  # pre-pivot — that is the driver we want (2026-10-05: the strongtz i915-sriov
  # weak-updates experiment is abandoned; it wedged the GT on every coldplug
  # boot, and the in-tree driver has no ARL SR-IOV anyway).
  - type: initramfs
  - type: signing # this sets up the proper policy & signing files for signed images to work fully

