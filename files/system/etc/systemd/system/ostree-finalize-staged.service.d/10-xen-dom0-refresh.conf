# Re-pair the Xen GRUB entry as the LAST step of the deployment transaction.
# ostree binds the staged deployment to /ostree/boot.1 during finalize (after
# its own dracut -f), so the script must run after ExecStop: an ExecStart hook
# computed the ostree= arg from the still-boot.0 tree and paired the PREVIOUS
# deployment's kernel+initrd with the new ostree= (2026-10-04 split-brain boot:
# the stock i915 from the old tree bound the iGPU).
[Service]
ExecStopPost=/usr/libexec/xen-dom0-refresh
