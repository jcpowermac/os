# The dom0 initrd must carry NO GPU driver. dracut installs the IN-TREE
# kernel/drivers/gpu/drm/i915/i915.ko — weak-updates priority is a *modprobe*
# rule, not a dracut one — so the stock display-only copy binds 00:02.0
# pre-pivot and the SR-IOV-patched copy can never take the PF afterwards (same
# module name, already loaded).
#
# Blacklists cannot express that: they key on the module NAME and both copies
# are named i915. `rd.driver.blacklist=i915` blocks the patched one too, and
# dracut implements it by writing /run/modprobe.d/initramfsblacklist.conf —
# which survives switch_root (/run is a tmpfs), so it also blocks the
# real-root coldplug autoload. That is the 2026-10-04 dead UI: nothing bound
# 00:02.0, no /dev/dri, sddm logged "No graphical seats found".
#
# omit_drivers removes the FILES instead. Verified here: `dracut --force` with
# this file -> no i915/xe .ko in the initrd, 836 other modules intact;
# post-pivot udev coldplug then autoloads weak-updates/i915.ko
# (2026.09.16-sriov, has max_vfs) and the display comes up.
omit_drivers+=" i915 xe "
