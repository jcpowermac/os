# xen-runtime owns /var/lib/xen, but the image build drops it (same class of
# bug as the missing xen-hypervisor /boot payloads). Without it, xen-init-dom0
# (ExecStartPost of xenstored.service) fails to lock and never writes
# local/domain/0/name, so `xl list`/xentop show dom0 as (null).
D /var/lib/xen 0755 root root
